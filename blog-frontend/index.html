<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="./favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Blog - 个人技术博客</title>
    <meta name="description" content="分享技术、生活和思考的个人博客">
    <style>
      html { background: #0f0f1a; }
      #app { opacity: 0; min-height: 100vh; }
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #0f0f1a;
        transition: opacity 0.3s;
      }
      #splash.hide { opacity: 0; pointer-events: none; }
      #splash h1 {
        font-size: 2rem; font-weight: 700; color: #fff;
        letter-spacing: 0.1em; margin-bottom: 1.5rem;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      .loader {
        width: 32px; height: 32px;
        border: 3px solid rgba(255,255,255,0.12);
        border-top-color: rgba(255,255,255,0.7);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body style="margin:0;background:#0f0f1a;">
    <div id="splash">
      <h1>Starlitn'blog</h1>
      <div class="loader"></div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
